name: ESP32 Arduino firmware

on:
  push:
    paths:
      - "firmware/esp32-arduino/**"
      - "src/EnergyManagement.Api/Modules/Devices/**"
      - "src/EnergyManagement.Api/Modules/Telemetry/**"
      - "tests/EnergyManagement.Tests/Integration/DeviceAuthenticationTests.cs"
      - ".github/workflows/esp32-firmware.yml"
  pull_request:
    paths:
      - "firmware/esp32-arduino/**"
      - "src/EnergyManagement.Api/Modules/Devices/**"
      - "src/EnergyManagement.Api/Modules/Telemetry/**"
      - "tests/EnergyManagement.Tests/Integration/DeviceAuthenticationTests.cs"
      - ".github/workflows/esp32-firmware.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  firmware-tests:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run Python firmware contract tests
        run: python -m unittest discover -s firmware/esp32-arduino/tests -v

      - name: Build and run native C++ edge-case tests
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -pedantic firmware/esp32-arduino/tests/native/test_firmware_core.cpp -o /tmp/ems-firmware-tests
          /tmp/ems-firmware-tests

  compile-esp32:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pinned Arduino CLI
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/v1.2.2/install.sh | BINDIR="$HOME/.local/bin" sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          arduino-cli version

      - name: Install pinned ESP32 core and libraries
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.3.12
          arduino-cli lib install ArduinoJson@7.4.3 PZEM004Tv30@1.2.1

      - name: Compile firmware (secrets replaced with safe placeholders)
        run: |
          cp firmware/esp32-arduino/EMS_ESP32/Config.example.h firmware/esp32-arduino/EMS_ESP32/Config.h
          arduino-cli compile --warnings all --fqbn esp32:esp32:esp32 firmware/esp32-arduino/EMS_ESP32
