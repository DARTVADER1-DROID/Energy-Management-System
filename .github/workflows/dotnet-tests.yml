name: .NET tests

on:
  push:
    branches: [main, "feat/**", "build/**", "deploy/**", "fix/**"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: energy_management_tests
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test_user -d energy_management_tests"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      EMS_TEST_CONNECTION_STRING: Host=localhost;Port=5432;Database=energy_management_tests;Username=test_user;Password=test_password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install frontend tooling
        run: npm install --no-audit --no-fund
      - name: Test frontend resilience and theme behaviour
        run: npm run test:frontend
      - name: Build Tailwind assets
        run: npm run build
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Run .NET tests
        run: dotnet test tests/EnergyManagement.Tests/EnergyManagement.Tests.csproj --configuration Release
      - name: Build production Docker image
        run: docker build --pull --tag energy-management-ems:ci .
