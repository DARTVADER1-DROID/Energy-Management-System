services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: energy_management_tests
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_password
    ports:
      - "${EMS_TEST_POSTGRES_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test_user -d energy_management_tests"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
